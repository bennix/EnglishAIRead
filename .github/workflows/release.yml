name: Build Folio installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and publish (for example v1.0.1)"
        required: false
        type: string
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    env:
      HAS_MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            args: "--mac dmg zip"
          - os: windows-2022
            platform: win
            args: "--win nsis"
          - os: ubuntu-22.04
            platform: linux
            args: "--linux AppImage deb rpm"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build macOS installers
        if: matrix.platform == 'mac' && env.HAS_MACOS_CERTIFICATE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: npx electron-builder ${{ matrix.args }}
      - name: Build Windows/Linux installers
        if: matrix.platform != 'mac'
        run: npx electron-builder ${{ matrix.args }}
      - name: Upload artifacts
        if: matrix.platform != 'mac' || env.HAS_MACOS_CERTIFICATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') && (matrix.platform != 'mac' || env.HAS_MACOS_CERTIFICATE == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: release/*
